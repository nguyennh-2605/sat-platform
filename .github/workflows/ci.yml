name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  server:
    name: Server checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sat_platform_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sat_platform_test
      JWT_SECRET: ci-only-secret-with-sufficient-entropy-do-not-use-in-production
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sat_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sat_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to test database
        run: npm run db:migrate:deploy
      - name: Run server tests
        run: npm test

  browser-journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sat_platform_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sat_platform_e2e_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sat_platform_e2e_test
      JWT_SECRET: ci-only-secret-with-sufficient-entropy-do-not-use-in-production
      NODE_ENV: test
      CORS_ORIGINS: http://127.0.0.1:4173
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sat_platform_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sat_platform_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Apply migrations to browser-test database
        run: npm run db:migrate:deploy
        working-directory: server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Run full-stack golden paths
        run: npm run test:e2e:full
